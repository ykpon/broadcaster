name: broadcaster
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-local-only-change-me-123456}
      STUN_LISTEN_ADDR: ":3478"
      STUN_URL: ${STUN_URL:-stun:localhost:3478}
      TRUST_PROXY: "true"
    depends_on:
      - livekit
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "${STUN_PORT:-3478}:3478/udp"
  livekit:
    build:
      context: deploy
      dockerfile: LiveKit.Dockerfile
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-local-only-change-me-123456}"
    ports:
      # Signaling/API stays on loopback and is proxied by host Nginx.
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:-7880}:7880/tcp"
      - "7881:7881/tcp"
      - "50000-50050:50000-50050/udp"
